# Railway → Settings → Root Directory = whatsapp-gateway
# Settings → Build → Builder = DOCKERFILE (desligue Railpack / Nixpacks)

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
# Não usar buildCommand do monorepo (bun)

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "on_failure"
